<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · DSL量化交易系统</title>
<link rel="stylesheet" href="/static/design-system.css?v=20260530">
<style>
:root {
  --bg: #08090d; --bg2: #12141c; --bg3: #1a1d27;
  --border: #2a2f42; --text: #e2e8f0; --text2: #7a7870;
  --accent: #E8A838; --accent2: var(--success); --accent3: var(--danger);
}
body {
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
.login-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  padding: 40px 48px; width: 400px; max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.login-box h1 {
  font-size: 22px; font-weight: 600; margin-bottom: 4px; text-align: center;
}
.login-box .subtitle {
  font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 32px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: .5px;
}
.form-group input {
  width: 100%; padding: 12px 14px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); font-size: 15px; outline: none; transition: border-color .15s;
}
.form-group input:focus { border-color: var(--accent); }
.btn {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 500;
  cursor: pointer; transition: opacity .15s;
}
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.error-msg {
  color: var(--danger); font-size: 13px; text-align: center; margin-top: 16px; display: none;
}
.error-msg.show { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <h1>📈 DSL Trading</h1>
  <div class="subtitle">量化交易系统</div>
  <form id="login-form" autocomplete="off">
    <div class="form-group">
      <label for="username">用户</label>
      <input id="username" type="text" value="admin" readonly style="opacity:.6;cursor:not-allowed">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" autofocus>
    </div>
    <button class="btn" type="submit" id="login-btn">登录</button>
  </form>
  <div class="error-msg" id="error-msg"></div>
  <div class="loading" id="loading" style="display:none;text-align:center;margin-top:16px"><div class="spinner"></div></div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn'), errEl = document.getElementById('error-msg');
  const loading = document.getElementById('loading'), pwd = document.getElementById('password').value;
  btn.disabled = true; loading.style.display = 'block'; errEl.classList.remove('show');
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd}) });
    const data = await r.json();
    if (data.success) { window.location.href = '/'; }
    else { errEl.textContent = data.error || '密码错误'; errEl.classList.add('show'); }
  } catch (e) { errEl.textContent = '网络错误，请重试'; errEl.classList.add('show'); }
  finally { btn.disabled = false; loading.style.display = 'none'; }
});
</script>
</body>
</html>
